appId: com.jituc.textmaestro
productName: 'Text-maestro'
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# 将项目根目录的 README 文档作为额外资源打入安装包，
# 供「关于」页面在打包后环境下读取与打开
extraResources:
  - from: ../README.md
    to: README.md
    filter: ['**/*']
  - from: ../README-project.md
    to: README-project.md
    filter: ['**/*']
win:
  executableName: 'Text-maestro'
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: bairihai
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
# 当前阶段：仅本地分发，不发布到自动更新源。
# 未来切到 GitHub Releases 时，改成：
#   publish:
#     provider: github
#     owner: bairihai
#     repo: text-maestro
# 并在 src/main/index.ts 中接入 electron-updater 的 autoUpdater.checkForUpdates()
publish: null
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
